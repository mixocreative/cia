name: tests
on: [push, pull_request]
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fixture service tests (must be green - the defects sit under a green suite)
        working-directory: tests/fixture-service
        run: python -m unittest discover -s tests -t .
      - name: Skill frontmatter sanity
        run: |
          python - <<'PY'
          import re
          t=open('SKILL.md',encoding='utf-8').read()
          m=re.match(r'---\nname: (\S+)\ndescription: "(.*)"\n---\n',t,re.S)
          assert m and len(m.group(2))<=1024
          print('ok', m.group(1), len(m.group(2)))
          PY
      - name: Skill structure guard (nothing loose, S1-S24 once each, file-size debt named)
        run: python tools/check_structure.py
      - name: Design-check guard tests (each rule fails on a planted defect)
        run: python -m unittest discover -s tests/design-check -t tests/design-check
      - name: Harness launcher tests (prompts read from RUNBOOK, build runs on a copy)
        run: python -m unittest discover -s tests/harness -t tests/harness
      - name: Agent definition tests (no doctrine duplicated outside references/)
        run: python -m unittest discover -s tests/plugin -t tests/plugin
      - name: Scorer tests (build rows never move the audit gate)
        run: python -m unittest discover -s tests/tools -t tests/tools
